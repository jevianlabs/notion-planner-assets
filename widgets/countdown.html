<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Countdown</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;background:#FFF7F0;color:#B3261E;
font-family:ui-sans-serif,-apple-system,"system-ui","Segoe UI Variable Display","Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;text-align:center;padding:16px}
.n{font-family:ui-sans-serif,-apple-system,"system-ui","Segoe UI Variable Display","Segoe UI",Helvetica,Arial,sans-serif;font-weight:600;font-size:clamp(40px,16vw,92px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.u{font-size:.26em;font-style:italic;font-weight:500;margin-left:.2em;letter-spacing:0}
.l{font-size:clamp(11px,3vw,14px);letter-spacing:.16em;text-transform:uppercase;opacity:.62;margin-top:12px}
.setup{font-size:13px;line-height:1.6;opacity:.75;max-width:420px;font-style:italic;font-family:"Lyon-Text",Georgia,ui-serif,serif}
code{background:rgba(179,38,30,.09);padding:1px 5px;border-radius:4px;font-size:12px;font-style:normal}
</style></head>
<body><div id="r"></div>
<script>
var q=new URLSearchParams(location.search);
if(q.get('bg'))document.body.style.background='#'+q.get('bg').replace('#','');
if(q.get('fg'))document.body.style.color='#'+q.get('fg').replace('#','');
var d=q.get('date'), label=q.get('label')||'', r=document.getElementById('r');
function show(){
  if(!d||isNaN(new Date(d+'T00:00:00'))){
    r.className='setup';
    r.innerHTML='Add your date to the end of this link, then embed it.<br><br><code>?date=2027-01-01&label=New%20Year</code>';
    return;
  }
  var t=new Date(d+'T00:00:00'), n=new Date();
  var a=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  var days=Math.round((t-a)/86400000);
  var big, small;
  if(days>1){big=days;small='days to '+(label||'go')}
  else if(days===1){big=1;small='day to '+(label||'go')}
  else if(days===0){big='Today';small=label?'is '+label:'is the day'}
  else if(days===-1){big=1;small='day since '+(label||'then')}
  else {big=Math.abs(days);small='days since '+(label||'then')}
  r.innerHTML='<div class="n">'+big+'</div><div class="l">'+small+'</div>';
}
show();setInterval(show,60000);
</script></body></html>
